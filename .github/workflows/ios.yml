name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm i -g @capacitor/cli
      - name: Install deps
        run: npm install --legacy-peer-deps || true
      - name: Add iOS platform if missing
        run: |
          ls -la
          cat capacitor.config.* || echo "no config"
          if [ ! -d "ios" ]; then
            echo "Adding ios platform..."
            npx cap add ios || npm run cap:add:ios || true
          fi
          npx cap sync ios || npx cap copy ios || true
          ls -la ios/App/ || ls -la ios/ || echo "still no ios"
      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..
      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build clean archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO
      - name: Make IPA
        run: |
          mkdir -p ios/App/build/ipa/Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/build/ipa/Payload/
          cd ios/App/build/ipa
          zip -r App-unsigned.ipa Payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: ios/App/build/ipa/App-unsigned.ipa
