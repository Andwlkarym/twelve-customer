name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create fresh Capacitor iOS app wrapping your site
        run: |
          rm -rf ios
          npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://food-delivery-arabic.web.app"></head></html>' > www/index.html

          cat > capacitor.config.json << 'JSON'
          {
            "appId": "com.twelve.customer",
            "appName": "Twelve Customer",
            "webDir": "www",
            "server": {
              "url": "https://food-delivery-arabic.web.app",
              "cleartext": true
            }
          }
          JSON
          npx cap add ios
          npx cap sync ios
          ls -la ios/App/
          cat ios/App/Podfile | head -30

      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build IPA (no signing)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build clean archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Make IPA
        run: |
          mkdir -p /tmp/ipa/Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r App-unsigned.ipa Payload
          ls -lh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: /tmp/ipa/App-unsigned.ipa
