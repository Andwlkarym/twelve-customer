name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build IPA without Pods
        run: |
          rm -rf ios
          npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
          mkdir -p www
          echo '<html><body>Loading Twelve...</body></html>' > www/index.html
          cat > capacitor.config.json << 'JSON'
          {
            "appId": "com.twelve.customer",
            "appName": "Twelve Customer",
            "webDir": "www",
            "server": { "url": "https://food-delivery-arabic.web.app", "cleartext": true }
          }
          JSON
          npx cap add ios
          npx cap sync ios
          ls -la ios/App/
          
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build clean archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          cd ../..
          
          mkdir -p /tmp/ipa/Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r App-unsigned.ipa Payload
          ls -lh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: /tmp/ipa/App-unsigned.ipa
